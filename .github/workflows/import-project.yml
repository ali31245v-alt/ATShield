name: Import Android project archive
on:
  push:
    paths:
      - 'ATShield-archive.part-*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore project files
        run: |
          cat ATShield-archive.part-* > /tmp/project.zip.b64
          base64 -d /tmp/project.zip.b64 > /tmp/project.zip
          unzip -o /tmp/project.zip -d /tmp/atshield
          cp -a /tmp/atshield/. .
          rm -f ATShield-archive.part-*
      - name: Commit project source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import ATShield Android project source" || exit 0
          git push